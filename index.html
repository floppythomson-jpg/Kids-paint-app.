<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Coloring App - Con Tutor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background-color: #eef5ff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    h1 { color: #333; margin-bottom: 10px; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 12px; justify-content: center; max-width: 850px; width: 100%; }
    .tool-group { display: flex; align-items: center; gap: 5px; border-right: 1px solid #eee; padding-right: 8px; margin-right: 3px; }
    .btn { padding: 8px 12px; border: none; border-radius: 8px; background: #f0f0f0; cursor: pointer; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; transition: background 0.2s; }
    .btn:hover { background: #e0e0e0; }
    .btn.active { background: #4a90e2; color: white; }
    .btn-danger { background: #ffe0e0; color: #d32f2f; }
    .btn-danger:hover { background: #ffcdd2; }
    .btn-tutor { background: #ffca28; color: #333; font-size: 0.9rem; border-radius: 20px; padding: 6px 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
    .btn-tutor:hover { background: #ffb300; }
    
    .color-picker { width: 32px; height: 32px; border: none; border-radius: 50%; cursor: pointer; }
    
    .canvas-container { position: relative; width: 600px; height: 450px; background: white; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); overflow: hidden; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
    
    /* Capas */
    #bgCanvas { z-index: 1; }
    .drawing-layer { z-index: 10; }
    #templateCanvas { z-index: 100; pointer-events: none; }
    
    /* Selector de Capas UI */
    .layers-control { display: flex; gap: 4px; align-items: center; }
    .layer-item { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; background: #e0e0e0; cursor: pointer; }
    .layer-item.active { background: #ff9800; color: white; font-weight: bold; }

    /* Estilos del Modal del Mini Tutor */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: white; width: 90%; max-width: 420px; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: popIn 0.3s ease; position: relative; }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .tutor-avatar { font-size: 3.5rem; margin-bottom: 10px; }
    .tutor-title { font-size: 1.2rem; color: #333; margin-bottom: 10px; font-weight: bold; }
    .tutor-text { font-size: 0.95rem; color: #555; margin-bottom: 20px; line-height: 1.4; }
    .tutor-nav { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <h1>
    🎨 Mi Mini App de Pintar 
    <button class="btn btn-tutor" onclick="openTutor()">🐰 ¿Cómo jugar?</button>
  </h1>

  <div class="toolbar">
    <!-- Herramientas / Brochas -->
    <div class="tool-group">
      <button class="btn active" id="btnBrush" onclick="setTool('brush')">🖌️ Pincel</button>
      <button class="btn" id="btnMarker" onclick="setTool('marker')">🖋️ Marcador</button>
      <button class="btn" id="btnPencil" onclick="setTool('pencil')">✏️ Lápiz</button>
      <button class="btn" id="btnFill" onclick="setTool('fill')">🪣 Rellenar</button>
    </div>

    <!-- Color y Tamaño -->
    <div class="tool-group">
      <input type="color" id="colorPicker" class="color-picker" value="#ff0000">
      <input type="range" id="brushSize" min="2" max="40" value="10">
    </div>

    <!-- Control de Capas de Dibujo -->
    <div class="tool-group">
      <span style="font-size:0.8rem; font-weight:bold;">Capas:</span>
      <div id="layersList" class="layers-control"></div>
      <button class="btn" onclick="addLayer()">➕</button>
    </div>

    <!-- Gestión de Imagen / Plantilla -->
    <div class="tool-group">
      <input type="file" id="imageLoader" accept="image/*" style="display: none;">
      <button class="btn" onclick="document.getElementById('imageLoader').click()">🖼️ Cargar Imagen</button>
      <button class="btn btn-danger" onclick="removeTemplate()">❌ Quitar Imagen</button>
    </div>

    <!-- Acciones generales -->
    <div class="tool-group" style="border: none;">
      <button class="btn" onclick="undo()">↩️ Deshacer</button>
      <button class="btn btn-danger" onclick="clearCurrentLayer()">🗑️ Limpiar Capa</button>
      <button class="btn" style="background: #4caf50; color: white;" onclick="downloadImage()">💾 Guardar</button>
    </div>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="bgCanvas" width="600" height="450"></canvas>
    <!-- Las capas dinámicas se agregan aquí por JavaScript -->
    <canvas id="templateCanvas" width="600" height="450"></canvas>
  </div>

  <!-- Modal del Mini Tutor -->
  <div class="modal-overlay" id="tutorModal">
    <div class="modal-card">
      <div class="tutor-avatar" id="tutorAvatar">🐰</div>
      <div class="tutor-title" id="tutorTitle">¡Hola! Soy Floppy</div>
      <div class="tutor-text" id="tutorText">Te enseñaré a usar tu mini app de dibujo en unos pasos sencillos.</div>
      <div class="tutor-nav">
        <button class="btn" id="btnPrevTutor" onclick="prevStep()">⬅️ Atrás</button>
        <span id="stepIndicator" style="font-size: 0.8rem; font-weight: bold; color: #888;">1/4</span>
        <button class="btn" style="background: #ff9800; color: white;" id="btnNextTutor" onclick="nextStep()">Siguiente ➡️</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvasContainer');
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const tplCanvas = document.getElementById('templateCanvas');
    const tplCtx = tplCanvas.getContext('2d');

    let layers = [];
    let activeLayerIndex = 0;
    let isDrawing = false;
    let currentTool = 'brush';
    let undoHistory = [];
    const maxUndo = 10;

    // Fondo Blanco Inicial
    bgCtx.fillStyle = '#ffffff';
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    // Inicializar con la primera Capa de dibujo
    addLayer();

    function addLayer() {
      if (layers.length >= 3) {
        alert("Máximo 3 capas de dibujo permitidas");
        return;
      }

      const newCanvas = document.createElement('canvas');
      newCanvas.width = 600;
      newCanvas.height = 450;
      newCanvas.className = 'drawing-layer';
      newCanvas.style.zIndex = 10 + layers.length;

      container.insertBefore(newCanvas, tplCanvas);

      const layerObj = {
        canvas: newCanvas,
        ctx: newCanvas.getContext('2d'),
        id: layers.length + 1
      };

      layers.push(layerObj);
      selectLayer(layers.length - 1);
      updateLayersUI();
      attachEvents(newCanvas);
    }

    function selectLayer(index) {
      activeLayerIndex = index;
      layers.forEach((l, idx) => {
        l.canvas.style.pointerEvents = (idx === activeLayerIndex) ? 'auto' : 'none';
      });
      updateLayersUI();
    }

    function updateLayersUI() {
      const list = document.getElementById('layersList');
      list.innerHTML = '';
      layers.forEach((l, idx) => {
        const item = document.createElement('div');
        item.className = `layer-item ${idx === activeLayerIndex ? 'active' : ''}`;
        item.innerText = `Capa ${l.id}`;
        item.onclick = () => selectLayer(idx);
        list.appendChild(item);
      });
    }

    function getActiveCtx() {
      return layers[activeLayerIndex].ctx;
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-group .btn').forEach(b => b.classList.remove('active'));
      if(tool === 'brush') document.getElementById('btnBrush').classList.add('active');
      if(tool === 'marker') document.getElementById('btnMarker').classList.add('active');
      if(tool === 'pencil') document.getElementById('btnPencil').classList.add('active');
      if(tool === 'fill') document.getElementById('btnFill').classList.add('active');
    }

    function saveState() {
      if (undoHistory.length >= maxUndo) undoHistory.shift();
      const ctx = getActiveCtx();
      undoHistory.push({
        layerIndex: activeLayerIndex,
        data: ctx.getImageData(0, 0, 600, 450)
      });
    }

    function undo() {
      if (undoHistory.length > 0) {
        const lastState = undoHistory.pop();
        const ctx = layers[lastState.layerIndex].ctx;
        ctx.putImageData(lastState.data, 0, 0);
      }
    }

    function attachEvents(canvas) {
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e.touches[0]); });
      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });
      canvas.addEventListener('touchend', stopDrawing);
    }

    function startDrawing(e) {
      const activeCanvas = layers[activeLayerIndex].canvas;
      const rect = activeCanvas.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);

      saveState();

      if (currentTool === 'fill') {
        floodFill(x, y, document.getElementById('colorPicker').value);
        return;
      }

      isDrawing = true;
      const ctx = getActiveCtx();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const activeCanvas = layers[activeLayerIndex].canvas;
      const rect = activeCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const color = document.getElementById('colorPicker').value;
      const size = document.getElementById('brushSize').value;
      const ctx = getActiveCtx();

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentTool === 'brush') {
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
      } else if (currentTool === 'marker') {
        ctx.globalAlpha = 0.4;
        ctx.strokeStyle = color;
        ctx.lineWidth = size * 1.5;
      } else if (currentTool === 'pencil') {
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, size / 3);
      }

      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        const ctx = getActiveCtx();
        ctx.closePath();
        ctx.globalAlpha = 1.0;
      }
    }

    // Cargar plantilla
    document.getElementById('imageLoader').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          tplCtx.clearRect(0, 0, tplCanvas.width, tplCanvas.height);
          const hRatio = tplCanvas.width / img.width;
          const vRatio = tplCanvas.height / img.height;
          const ratio = Math.min(hRatio, vRatio);
          const centerShiftX = (tplCanvas.width - img.width * ratio) / 2;
          const centerShiftY = (tplCanvas.height - img.height * ratio) / 2;
          
          tplCtx.drawImage(img, 0, 0, img.width, img.height, centerShiftX, centerShiftY, img.width * ratio, img.height * ratio);
        }
        img.src = event.target.result;
      }
      if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });

    function removeTemplate() {
      tplCtx.clearRect(0, 0, tplCanvas.width, tplCanvas.height);
      document.getElementById('imageLoader').value = '';
    }

    function clearCurrentLayer() {
      saveState();
      const ctx = getActiveCtx();
      ctx.clearRect(0, 0, 600, 450);
    }

    // Flood Fill
    function floodFill(startX, startY, fillColorHex) {
      const ctx = getActiveCtx();
      const imgData = ctx.getImageData(0, 0, 600, 450);
      const data = imgData.data;
      const targetColor = getPixelColor(data, startX, startY);
      const fillColor = hexToRgb(fillColorHex);

      if (colorsMatch(targetColor, fillColor)) return;

      const queue = [[startX, startY]];
      while (queue.length > 0) {
        const [x, y] = queue.pop();
        const idx = (y * 600 + x) * 4;

        if (x < 0 || x >= 600 || y < 0 || y >= 450) continue;

        if (colorsMatch(getPixelColor(data, x, y), targetColor)) {
          setPixelColor(data, idx, fillColor);
          queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function getPixelColor(data, x, y) {
      const idx = (y * 600 + x) * 4;
      return [data[idx], data[idx+1], data[idx+2], data[idx+3]];
    }

    function setPixelColor(data, idx, color) {
      data[idx] = color[0];
      data[idx+1] = color[1];
      data[idx+2] = color[2];
      data[idx+3] = 255;
    }

    function colorsMatch(c1, c2) {
      return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
    }

    function hexToRgb(hex) {
      const bigint = parseInt(hex.slice(1), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255, 255];
    }

    function downloadImage() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 600;
      exportCanvas.height = 450;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.drawImage(bgCanvas, 0, 0);
      layers.forEach(l => expCtx.drawImage(l.canvas, 0, 0));
      expCtx.drawImage(tplCanvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'mi-dibujo-floppy.png';
      link.href = exportCanvas.toDataURL();
      link.click();
    }

    /* LÓGICA DEL MINI TUTOR */
    let currentStep = 0;
    const tutorSteps = [
      {
        avatar: "🖌️",
        title: "¡Elige tu Herramienta!",
        text: "Usa el <b>Pincel</b> para trazar, el <b>Marcador</b> para colorear suave, el <b>Lápiz</b> para detalles finos y el <b>Bote de Relleno</b> 🪣 para pintar áreas enteras."
      },
      {
        avatar: "🥞",
        title: "¡Usa las Capas!",
        text: "Las capas son como hojas transparentes apiladas. Toca <b>➕</b> para agregar hasta 3 capas. Así puedes pintar sin borrar lo que hiciste antes."
      },
      {
        avatar: "🖼️",
        title: "Pinta sobre Dibujos",
        text: "Presiona <b>Cargar Imagen</b> para usar una plantilla para colorear. Si quieres quitarla después, solo toca el botón rojo <b>❌ Quitar Imagen</b>."
      },
      {
        avatar: "💾",
        title: "Guarda tu Arte",
        text: "Cuando termines tu obra maestra, presiona el botón verde <b>💾 Guardar</b> para descargarla a tu dispositivo."
      }
    ];

    function openTutor() {
      currentStep = 0;
      updateTutorUI();
      document.getElementById('tutorModal').style.display = 'flex';
    }

    function updateTutorUI() {
      const step = tutorSteps[currentStep];
      document.getElementById('tutorAvatar').innerText = step.avatar;
      document.getElementById('tutorTitle').innerText = step.title;
      document.getElementById('tutorText').innerHTML = step.text;
      document.getElementById('stepIndicator').innerText = `${currentStep + 1}/${tutorSteps.length}`;

      document.getElementById('btnPrevTutor').style.visibility = (currentStep === 0) ? 'hidden' : 'visible';
      
      const nextBtn = document.getElementById('btnNextTutor');
      if (currentStep === tutorSteps.length - 1) {
        nextBtn.innerText = "¡Entendido! 🎉";
        nextBtn.style.background = "#4caf50";
      } else {
        nextBtn.innerText = "Siguiente ➡️";
        nextBtn.style.background = "#ff9800";
      }
    }

    function nextStep() {
      if (currentStep < tutorSteps.length - 1) {
        currentStep++;
        updateTutorUI();
      } else {
        closeTutor();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        updateTutorUI();
      }
    }

    function closeTutor() {
      document.getElementById('tutorModal').style.display = 'none';
    }
  </script>
</body>
</html>
