<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Coloring App - Fixed Layers</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #eef5ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      color: #ff4757;
      margin-bottom: 12px;
      font-size: 2rem;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 850px;
      width: 100%;
    }

    .gallery {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .gallery span {
      font-weight: bold;
      color: #2f3542;
    }

    .thumb {
      width: 48px;
      height: 48px;
      border: 2px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
      background-color: #f9f9f9;
      transition: transform 0.1s ease, border-color 0.2s ease;
      padding: 3px;
    }

    .thumb:hover {
      transform: scale(1.1);
      border-color: #1e90ff;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      width: 100%;
    }

    .palette {
      display: flex;
      gap: 6px;
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .color-btn:hover, .color-btn.active {
      transform: scale(1.2);
    }

    .brush-size {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #2f3542;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      background-color: #54a0ff;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .action-btn:hover {
      background-color: #2e86de;
    }

    .action-btn:disabled {
      background-color: #ccc !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    .action-btn.undo { background-color: #eccc68; color: #2f3542; }
    .action-btn.clear { background-color: #ff6b81; }
    .action-btn.download { background-color: #2ed573; }
    .action-btn.add-layer { background-color: #a55eea; }

    /* Control de Capas */
    .layer-manager {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f2f6;
      padding: 6px 10px;
      border-radius: 12px;
    }

    .layer-list {
      display: flex;
      gap: 6px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #ffffff;
      padding: 4px 8px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      color: #57606f;
    }

    .layer-item.active {
      border-color: #a55eea;
      color: #2f3542;
      background: #f3e8ff;
    }

    .layer-toggle-vis {
      cursor: pointer;
      font-size: 0.9rem;
    }

    #imageLoader { display: none; }

    /* Contenedor e Lienzos Superpuestos */
    .canvas-container {
      position: relative;
      width: 700px;
      height: 450px;
      border: 4px dashed #70a1ff;
      border-radius: 15px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .canvas-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    #bgCanvas {
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎨 Kids Paint Zone ✨</h1>

    <!-- Plantillas de la Galería -->
    <div class="gallery">
      <span>Templates:</span>
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' stroke='black' stroke-width='4' fill='none'/><circle cx='35' cy='40' r='5' fill='black'/><circle cx='65' cy='40' r='5' fill='black'/><path d='M 30 65 Q 50 85 70 65' stroke='black' stroke-width='4' fill='none'/></svg>" class="thumb">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 64,36 98,38 72,61 80,95 50,76 20,95 28,61 2,38 36,36' stroke='black' stroke-width='4' fill='none'/></svg>" class="thumb">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M 50 30 C 20 0, 0 40, 50 85 C 100 40, 80 0, 50 30 Z' stroke='black' stroke-width='4' fill='none'/></svg>" class="thumb">
    </div>
    
    <div class="toolbar">
      <div class="palette">
        <button class="color-btn active" style="background-color: #ff4757;" data-color="#ff4757"></button>
        <button class="color-btn" style="background-color: #2ed573;" data-color="#2ed573"></button>
        <button class="color-btn" style="background-color: #1e90ff;" data-color="#1e90ff"></button>
        <button class="color-btn" style="background-color: #ffa502;" data-color="#ffa502"></button>
        <button class="color-btn" style="background-color: #9b59b6;" data-color="#9b59b6"></button>
        <button class="color-btn" style="background-color: #2f3542;" data-color="#2f3542"></button>
      </div>

      <div class="brush-size">
        <label for="size">Brush:</label>
        <input type="range" id="size" min="2" max="40" value="10">
      </div>

      <!-- Administrador de Capas -->
      <div class="layer-manager">
        <div class="layer-list" id="layerList"></div>
        <button class="action-btn add-layer" id="addLayerBtn">➕ Layer</button>
      </div>

      <div class="controls">
        <button class="action-btn undo" id="undoBtn">↩️ Undo</button>
        <label for="imageLoader" class="action-btn">🖼️ Upload</label>
        <input type="file" id="imageLoader" accept="image/*">
        <button class="action-btn clear" id="clearBtn">🗑️ Clear</button>
        <button class="action-btn download" id="downloadBtn">💾 Save</button>
      </div>
    </div>

    <!-- Contenedor del Canvas -->
    <div class="canvas-container" id="canvasContainer">
      <canvas id="bgCanvas" width="700" height="450"></canvas>
    </div>
  </div>

  <script>
    const canvasContainer = document.getElementById('canvasContainer');
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');

    const colorBtns = document.querySelectorAll('.color-btn');
    const sizeInput = document.getElementById('size');
    const clearBtn = document.getElementById('clearBtn');
    const undoBtn = document.getElementById('undoBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const imageLoader = document.getElementById('imageLoader');
    const thumbs = document.querySelectorAll('.thumb');

    const addLayerBtn = document.getElementById('addLayerBtn');
    const layerListUI = document.getElementById('layerList');

    const MAX_PAINT_LAYERS = 3;
    let paintLayers = [];
    let activeLayerIndex = -1;

    let isDrawing = false;
    let currentColor = '#ff4757';
    let currentSize = 10;
    let history = [];
    const MAX_HISTORY = 10;

    // Crear Capa Dinámica
    function createLayer() {
      if (paintLayers.length >= MAX_PAINT_LAYERS) return;

      const layerId = paintLayers.length + 1;
      const canvas = document.createElement('canvas');
      canvas.width = 700;
      canvas.height = 450;
      canvas.style.zIndex = layerId + 1; // Colocar por encima de bgCanvas (zIndex 1)

      const ctx = canvas.getContext('2d');
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Agregar eventos directos a cada canvas creado
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDrawing);

      canvasContainer.appendChild(canvas);

      const layerObj = {
        id: layerId,
        canvas: canvas,
        ctx: ctx,
        visible: true
      };

      paintLayers.push(layerObj);
      setActiveLayer(paintLayers.length - 1);
    }

    function setActiveLayer(index) {
      activeLayerIndex = index;
      history = []; // Limpiar historial para la capa actual
      
      // Ajustar cursor e interactividad en cada capa
      paintLayers.forEach((layer, i) => {
        if (i === activeLayerIndex) {
          layer.canvas.style.pointerEvents = 'auto';
          layer.canvas.style.cursor = 'crosshair';
        } else {
          layer.canvas.style.pointerEvents = 'none';
        }
      });

      updateLayerUI();
    }

    function updateLayerUI() {
      layerListUI.innerHTML = '';
      
      paintLayers.forEach((layer, index) => {
        const item = document.createElement('div');
        item.className = `layer-item ${index === activeLayerIndex ? 'active' : ''}`;
        
        const name = document.createElement('span');
        name.innerText = `L${layer.id}`;
        name.onclick = () => setActiveLayer(index);

        const visToggle = document.createElement('span');
        visToggle.className = 'layer-toggle-vis';
        visToggle.innerText = layer.visible ? '👁️' : '🙈';
        visToggle.onclick = (e) => {
          e.stopPropagation();
          layer.visible = !layer.visible;
          layer.canvas.style.display = layer.visible ? 'block' : 'none';
          updateLayerUI();
        };

        item.appendChild(name);
        item.appendChild(visToggle);
        layerListUI.appendChild(item);
      });

      // Habilitar / Deshabilitar botón
      if (paintLayers.length >= MAX_PAINT_LAYERS) {
        addLayerBtn.disabled = true;
      } else {
        addLayerBtn.disabled = false;
      }
    }

    function getActiveLayer() {
      return paintLayers[activeLayerIndex] || null;
    }

    function saveState() {
      const active = getActiveLayer();
      if (!active) return;
      if (history.length >= MAX_HISTORY) history.shift();
      history.push(active.ctx.getImageData(0, 0, bgCanvas.width, bgCanvas.height));
    }

    function getCoords(e) {
      const rect = bgCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      const active = getActiveLayer();
      if (!active || !active.visible) return;

      saveState();
      isDrawing = true;
      const coords = getCoords(e);
      active.ctx.beginPath();
      active.ctx.moveTo(coords.x, coords.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      
      const active = getActiveLayer();
      if (!active) return;

      const coords = getCoords(e);
      active.ctx.strokeStyle = currentColor;
      active.ctx.lineWidth = currentSize;

      active.ctx.lineTo(coords.x, coords.y);
      active.ctx.stroke();
    }

    function stopDrawing() {
      const active = getActiveLayer();
      if (isDrawing && active) {
        active.ctx.closePath();
        isDrawing = false;
      }
    }

    function drawBackgroundImage(img) {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      const hRatio = bgCanvas.width / img.width;
      const vRatio = bgCanvas.height / img.height;
      const ratio = Math.min(hRatio, vRatio);
      
      const centerShiftX = (bgCanvas.width - img.width * ratio) / 2;
      const centerShiftY = (bgCanvas.height - img.height * ratio) / 2;
      
      bgCtx.drawImage(
        img, 
        0, 0, img.width, img.height,
        centerShiftX, centerShiftY, img.width * ratio, img.height * ratio
      );
    }

    // Botón Agregar Capa
    addLayerBtn.addEventListener('click', () => {
      createLayer();
    });

    // Plantillas de Galería
    thumbs.forEach(thumb => {
      thumb.addEventListener('click', (e) => {
        const img = new Image();
        img.onload = () => drawBackgroundImage(img);
        img.src = e.target.src;
      });
    });

    // Cargar imagen de usuario
    imageLoader.addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => drawBackgroundImage(img);
        img.src = event.target.result;
      };
      if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });

    // Deshacer (Undo)
    undoBtn.addEventListener('click', () => {
      const active = getActiveLayer();
      if (active && history.length > 0) {
        const previousState = history.pop();
        active.ctx.putImageData(previousState, 0, 0);
      }
    });

    // Guardar imagen fusionando capas
    downloadBtn.addEventListener('click', () => {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = bgCanvas.width;
      tempCanvas.height = bgCanvas.height;
      const tempCtx = tempCanvas.getContext('2d');

      // Fondo Blanco
      tempCtx.fillStyle = '#ffffff';
      tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      // Dibujar fondo
      tempCtx.drawImage(bgCanvas, 0, 0);

      // Dibujar capas visibles
      paintLayers.forEach(layer => {
        if (layer.visible) {
          tempCtx.drawImage(layer.canvas, 0, 0);
        }
      });

      const link = document.createElement('a');
      link.download = 'my-drawing.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    });

    // Selector de colores
    colorBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelector('.color-btn.active').classList.remove('active');
        e.target.classList.add('active');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    sizeInput.addEventListener('input', (e) => currentSize = e.target.value);

    // Limpiar capa activa
    clearBtn.addEventListener('click', () => {
      const active = getActiveLayer();
      if (active) {
        saveState();
        active.ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      }
    });

    // Iniciar con la Capa 1 creada
    createLayer();
  </script>
</body>
</html>
